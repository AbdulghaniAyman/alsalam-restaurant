<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم السلام - القائمة الرئيسية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- شاشة الأقسام الرئيسية (البداية) -->
    <div id="categories-view" class="view active-view">
        <header class="main-header">
            <div class="logo-container">
                <img src="logo.svg" alt="مطعم السلام" class="brand-logo">
                <p>أصالة المذاق المصري والعربي</p>
            </div>
        </header>

        <main class="container">
            <h2 class="section-title">اختر القسم</h2>
            <div id="categories-grid" class="categories-grid">
                <!-- سيتم تعبئتها ديناميكياً بواسطة JavaScript -->
            </div>
        </main>

        <!-- التذييل ومعلومات التواصل (Footer) -->
        <footer class="site-footer">
            <div class="footer-content">
                <div class="footer-section">
                    <h3><i class="fa-solid fa-location-dot"></i> العنوان</h3>
                    <p>مدينة السادات - السوق التجاري - المنطقة الرابعة</p>
                </div>
                <div class="footer-section">
                    <h3><i class="fa-solid fa-phone"></i> تواصل معنا</h3>
                    <div class="phones">
                        <a href="tel:0100638288">0100638288</a>
                        <span>-</span>
                        <a href="tel:01006646943">01006646943</a>
                    </div>
                </div>
            </div>
            <div class="designer-credits">
                تصميم وتطوير الواجهة البرمجية: <a href="tel:01020867958" class="designer-phone">01020867958</a>
            </div>
        </footer>
    </div>

    <!-- شاشة عرض الأصناف داخل القسم (بنمط iOS) -->
    <div id="items-view" class="view">
        <header class="items-header">
            <button id="back-btn" class="back-btn">
                <i class="fa-solid fa-chevron-right"></i> الرئيسية
            </button>
            <h2 id="current-category-title">اسم القسم</h2>
            <div style="width: 60px;"></div> <!-- لضمان التوازن البصري -->
        </header>

        <main class="container">
            <div id="items-grid" class="items-grid">
                <!-- سيتم تعبئتها ديناميكياً بواسطة JavaScript -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
