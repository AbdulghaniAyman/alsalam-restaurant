<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم السلام - القائمة الرئيسية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- هيدر اللوجو -->
        <header class="main-header">
            <div class="logo-container">
                <img src="logo.svg" alt="مطعم السلام" class="brand-logo" onerror="this.src='logo.png'">
                <p>أصالة المذاق المصري والعربي</p>
            </div>
        </header>

        <!-- شريط الأقسام الأفقي العلوي -->
        <nav class="categories-bar-wrapper">
            <div id="categories-bar" class="categories-bar">
                <!-- يتم تعبئتها عبر الجافاسكريبت -->
            </div>
        </nav>

        <!-- شبكة عرض الأصناف -->
        <main class="container">
            <div id="items-grid" class="items-grid">
                <!-- يتم تعبئتها عبر الجافاسكريبت -->
            </div>
        </main>

        <!-- نافذة تفاصيل الصنف واختيار الأحجام (Modal) -->
        <div id="item-modal" class="modal-overlay">
            <div class="modal-content">
                <button class="close-modal" id="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
                <div class="modal-img-container">
                    <img id="modal-img" src="" alt="صنف الطعام">
                </div>
                <h3 id="modal-title">اسم الصنف</h3>
                <p id="modal-desc">وصف الصنف</p>
                
                <!-- أزرار اختيار الأحجام -->
                <div id="modal-sizes-container" class="sizes-container">
                    <!-- يتم توليد الأحجام هنا -->
                </div>

                <!-- السعر المتغير -->
                <div class="modal-price-box">
                    <span id="modal-price">0</span> <span class="currency">جنيه</span>
                </div>

                <button class="order-now-btn" id="order-now-btn">
                    اطلب الآن <i class="fa-solid fa-fire"></i>
                </button>
            </div>
        </div>

        <!-- معلومات التواصل والعنوان ورقم المطور -->
        <footer class="site-footer">
            <div class="footer-content">
                <div class="footer-section">
                    <h3><i class="fa-solid fa-location-dot"></i> العنوان</h3>
                    <p>مدينة السادات - السوق التجاري - المنطقة الرابعة</p>
                </div>
                <div class="footer-section">
                    <h3><i class="fa-solid fa-phone"></i> تواصل معنا</h3>
                    <div class="phones">
                        <a href="tel:0100638288">01000638288</a>
                        <span>-</span>
                        <a href="tel:01006646943">01006646943</a>
                    </div>
                </div>
            </div>
           
    </div>

    <script src="script.js?v=5"></script>
</body>
</html>
